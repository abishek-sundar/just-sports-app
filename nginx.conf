# IMSA results only change once a whole new event posts (roughly biweekly) —
# cache proxied responses here, shared across every visitor, so the season
# walk (dozens of requests) hits the upstream once a day total, not once per
# browser. Lives in the container's own writable layer; wiped on container
# recreate, which is fine — it just refills on the next request.
proxy_cache_path /var/cache/nginx/imsa levels=1:2 keys_zone=imsa_cache:10m max_size=200m inactive=48h use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The webroot is a git checkout — never serve .git or other dotfiles.
    location ~ /\.(?!well-known) { deny all; }

    # News API → the aggregator container, same origin (no CORS).
    # resolver + variable so nginx starts even if the aggregator is briefly down,
    # and picks up its new IP if it restarts.
    location /news {
        resolver 127.0.0.11 valid=30s;
        set $news_upstream http://justsports-news:8787;
        proxy_pass $news_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # IMSA results (Al Kamel timing system) → proxied same-origin since the
    # upstream sends no CORS headers at all (unlike ESPN/Jolpica). Public
    # resolver + variable so nginx doesn't hard-fail if a DNS lookup hiccups,
    # and re-resolves if the upstream's IP (CloudFront-backed) ever changes.
    location /imsa-data/ {
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host imsa.results.alkamelcloud.com;
        set $imsa_upstream https://imsa.results.alkamelcloud.com;
        rewrite ^/imsa-data/(.*)$ /$1 break;
        proxy_pass $imsa_upstream;

        proxy_cache imsa_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 502 503 5m;
        proxy_cache_use_stale error timeout updating http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # SPA-style routing: /mlb, /nba, /f1 all resolve to the app shell.
    # (Makes the per-sport index.html copies optional inside the container.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the shell/assets so updates show up on next load.
    # (Scores are fetched live client-side and are never cached here anyway.)
    location ~* \.(js|css|webmanifest|html)$ {
        add_header Cache-Control "no-cache";
    }
}
