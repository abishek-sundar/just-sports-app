server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style routing: /mlb, /nba, /f1 all resolve to the app shell.
    # (Makes the per-sport index.html copies optional inside the container.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the shell/assets so updates show up on next load.
    # (Scores are fetched live client-side and are never cached here anyway.)
    location ~* \.(js|css|webmanifest|html)$ {
        add_header Cache-Control "no-cache";
    }
}
