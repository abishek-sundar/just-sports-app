<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JustSports — scores and news. No images, no video, no betting odds." />
  <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0c0a" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>JustSports</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="wordmark">Just<span>Sports</span></h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <span class="theme-toggle-label">Dark</span>
    </button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sports">
    <!-- tab buttons injected by app.js -->
  </nav>

  <main id="content">
    <section class="panel">
      <div class="col">
        <div class="col-head">
          <div class="subtabs" role="tablist" aria-label="View">
            <button class="subtab" data-view="results" role="tab" aria-selected="true" type="button">Results</button>
            <button class="subtab" data-view="schedule" role="tab" aria-selected="false" type="button">Schedule</button>
            <button class="subtab" data-view="standings" role="tab" aria-selected="false" type="button">Standings</button>
          </div>
          <select id="imsa-series" class="imsa-series" aria-label="IMSA series" hidden></select>
          <button id="news-jump" class="news-jump" type="button">News <svg class="news-jump-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button>
        </div>
        <div id="scores" class="list" aria-live="polite"></div>
      </div>
      <div class="col" id="news-col">
        <h2 class="col-title">News</h2>
        <div id="news" class="list"></div>
      </div>
    </section>
  </main>

  <footer class="footnote">
    <span id="status-line">—</span>
    <span class="dot">·</span>
    <span>Scores: ESPN &amp; Jolpica · Just text.</span>
  </footer>

  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
